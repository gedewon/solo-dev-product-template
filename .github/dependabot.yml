# Dependency updates as pull requests. /triage reviews them; you merge.
# Minor and patch updates arrive as one grouped PR a week so they don't
# flood the queue. Major updates come one per PR because they can break things.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
